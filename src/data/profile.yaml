principles:
- title: Repeatable, Teachable Frameworks & Processes
  text: 'Great solutions architecture is a product of requirements and approach, and the approach should be one you can repeat and teach. I start projects the same way every time: find ALL of the pre-existing failed or aging processes already in place, whether they involve people, networks or computational systems, and LEARN why they are failing or in need of replacement. Skip this step and you never truly understand the requirements, and every "better" solution you try and introduce brings unnecessary failure and friction.'
- title: Communicate Often AND Effectively
  text: Knowing how to communicate with people is foundational to success. Learn how each person prefers to communicate, which tools or medium work best, and how often to check in. Those discoveries are what carry a project from idea to delivery.
- title: Honesty & Openness Create Stronger Bonds
  text: Be brave with openness and have the courage to be honest. Few great feats have ever been accomplished by half measures, and even fewer alone.
- title: Security Is a Requirement, Not a Feature
  text: Security belongs in discovery, not in the last review before launch. The cheapest control is the one designed in from the first conversation, when you are still learning how people, networks and systems actually behave.
